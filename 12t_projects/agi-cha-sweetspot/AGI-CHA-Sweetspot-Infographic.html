<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AGI / CHA Sweet Spot</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #edf1ef;
    --ink: #16211e;
    --ink-dim: #7c8783;
    --line: #ccd3d0;
    --accent: #a8701a;
    --accent-dim: #c79a54;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10171a;
      --ink: #e7eeec;
      --ink-dim: #66716e;
      --line: #263030;
      --accent: #e3a44c;
      --accent-dim: #93702f;
    }
  }

  :root[data-theme="dark"] {
    --bg: #10171a;
    --ink: #e7eeec;
    --ink-dim: #66716e;
    --line: #263030;
    --accent: #e3a44c;
    --accent-dim: #93702f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Roboto Mono", monospace;
  }

  .wrap {
    display: flex;
    align-items: stretch;
    gap: 46px;
  }

  .col { display: flex; flex-direction: column; }

  .masthead {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 0 0 26px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .icon {
    width: 50px;
    height: 50px;
    image-rendering: pixelated;
    image-rendering: -webkit-optimize-contrast;
  }
  .col--down .icon {
    filter: grayscale(1) contrast(0.85) brightness(0.85);
    opacity: 0.6;
  }

  .head {
    font-family: "Bahnschrift", "Segoe UI Semibold", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: center;
    margin: 0;
  }
  .col--up .head { color: var(--accent); }
  .col--down .head { color: var(--ink-dim); }

  .eqs {
    display: grid;
    grid-template-columns: auto auto 1fr;
    align-items: center;
    column-gap: 12px;
    row-gap: 26px;
  }

  .lbl {
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.02em;
  }
  .col--up .lbl { color: var(--accent); }
  .col--down .lbl { color: var(--ink); }

  .op { color: var(--ink-dim); font-size: 17px; }

  .expr {
    font-weight: 700;
    font-size: 22px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
  }
  .col--up .expr { color: var(--accent); }
  .col--down .expr { color: var(--ink); }

  .bracket {
    font-weight: 200;
    font-size: 46px;
    line-height: 1;
    color: var(--ink-dim);
    transform: scaleY(1.55);
    display: inline-block;
  }
  .bracket--l { margin-right: 4px; }
  .bracket--r { margin-left: 4px; }

  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
  }
  .frac .num {
    padding: 0 4px 3px;
    border-bottom: 1.5px solid currentColor;
  }
  .frac .den { padding: 3px 4px 0; }

  .pow {
    font-size: 13px;
    font-weight: 700;
    align-self: flex-start;
    transform: translateY(-9px);
    margin-left: 2px;
  }

  .divider {
    width: 1px;
    background: var(--line);
  }

  @media (max-width: 620px) {
    .wrap { flex-direction: column; gap: 40px; }
    .divider { width: 100%; height: 1px; }
  }
</style>
</head>
