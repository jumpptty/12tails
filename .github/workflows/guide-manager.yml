# Guide manager from the phone (docs/superpowers/specs/2026-10-20-guide-manager-mobile-design.md): publishes a queue of class guide changes
# sent by 12t_projects/guide-manager (GitHub mode, the user's key) through the same pipeline as scripts/add_guide.js on the PC, one stage per
# step so the page can tick them. Every failure is one "gm-error" annotation and the outcome one "gm-result" annotation, which the page reads back.
# Checked on GitHub 2026-10-20: this token's push is allowed on the protected branch and starts the Pages build by itself.
name: guide-manager
run-name: guide manager ${{ inputs.request }}
on:
  workflow_dispatch:
    inputs:
      request:
        description: request id (made by the page)
        required: true
        type: string
      payload:
        description: 'the queue as JSON: {"items":[{action,id,code,modes}]} or {"undo":{"sha":"<commit>"}}'
        required: true
        type: string
      dry:
        description: check only (no commit, no push)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: guide-manager
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok
      DRY: ${{ inputs.dry && '--dry-run' || '' }}
    steps:
      - name: ส่งงานให้ GitHub
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: ส่งงานให้ GitHub
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: ตรวจสถานะ git
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/request.json"
          node scripts/add_guide.js batch "$RUNNER_TEMP/request.json" --stage git $DRY
      - name: แก้ไฟล์ index.html
        run: node scripts/add_guide.js batch "$RUNNER_TEMP/request.json" --stage edit $DRY
      - name: ตรวจด้วย validator
        run: node scripts/add_guide.js batch "$RUNNER_TEMP/request.json" --stage check $DRY
      - name: commit
        if: ${{ !inputs.dry }}
        run: |
          export GIT_AUTHOR_NAME="$(git log -1 --format=%an)" GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae)"
          export GIT_COMMITTER_NAME="github-actions[bot]" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/add_guide.js batch "$RUNNER_TEMP/request.json" --stage commit
      - name: อัปขึ้น GitHub
        if: ${{ !inputs.dry }}
        run: node scripts/add_guide.js batch "$RUNNER_TEMP/request.json" --stage push
