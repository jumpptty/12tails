# Guide manager from the phone (docs/superpowers/specs/2026-10-20-guide-manager-mobile-design.md).
# SPIKE (Task 1 of docs/superpowers/plans/2026-10-20-guide-manager-mobile.md): checks the GitHub side before the real steps go in (Task 3).
name: guide-manager
run-name: guide manager ${{ inputs.request }}
on:
  workflow_dispatch:
    inputs:
      request:
        description: request id (made by the page)
        required: true
        type: string
      payload:
        description: the queue as JSON
        required: true
        type: string
      dry:
        description: check only
        type: boolean
        default: false
      spike_push:
        description: spike only, push one empty commit
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: guide-manager
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok
    steps:
      - name: ส่งงานให้ GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: ส่งงานให้ GitHub
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ตรวจสถานะ git
        run: sleep 5
      - name: ตรวจด้วย validator
        run: |
          echo "::error title=gm-error::line one%0A[CLASS GUIDE ERROR] line two"
          node -e 'const pad = "x".repeat(5980); process.stdout.write("::notice title=gm-result::" + JSON.stringify({ ok: true, pad }) + "\n")'
      - name: อัปขึ้น GitHub
        if: ${{ inputs.spike_push }}
        run: |
          export GIT_AUTHOR_NAME="$(git log -1 --format=%an)" GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae)"
          export GIT_COMMITTER_NAME="github-actions[bot]" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -q -m "chore(tools): guide manager push test"
          git push origin HEAD:skill-cooldown-lookup
