<title>12 Tails — Penguin Skill Sheet</title>
<style>
  :root{
    --backdrop:#DCE7EA;
    --paper:#FBFDFE;
    --ink:#1D2A2E;
    --ink-soft:#526169;
    --line:#CBDEE3;
    --chip-bg:#EAF4F6;
    --ko:#8A3B2E;
    /* ==== PER-CLASS ACCENT — swap these 2 lines for a new class, nothing
       else in this stylesheet should need to change. Penguin = aqua. ==== */
    --acc:#1387A8;    --acc-tint:#E4F4F7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --backdrop:#162326; }
  }
  :root[data-theme="dark"]{ --backdrop:#162326; }
  :root[data-theme="light"]{ --backdrop:#DCE7EA; }

  html,body{margin:0;padding:0;}
  body{
    background:var(--backdrop);
    font-family:'Segoe UI',system-ui,sans-serif;
    color:var(--ink);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  /* ---------- document shell ---------- */
  /* No document header/footer at all — the sheet doesn't name the game or the
     class anywhere on the page (the file name / <title> is enough for that).
     The ONLY repeating per-page chrome is a tiny "which tier am I in" chip —
     see .pagechip below. Each TIER gets its OWN <table class="pagewrap"> (4
     tables total, one per tier), each with its own <thead> holding just that
     tier's .band chip. A <thead> repeats natively on every physical page its
     own table spans (Chrome print engine reserves space for and reflows
     around thead on each split page) — so if e.g. Class B's cards run past a
     page boundary, "CLASS B" reappears at the top of the next page too,
     without ever needing to know or compute which tier is "current" (an
     earlier position:fixed attempt at a repeating header looked right
     on-screen but painted over content on every page after the first, since
     position:fixed in Chrome's print pipeline anchors to the page's margin
     box, not the physical page edge — a <thead> has no such problem). Four
     separate tables (rather than one table with 4 theads swapped mid-flow,
     which isn't a thing HTML supports) also means tiers with no content left
     to show just don't reserve a thead's height on later pages. */
  .doc{
    background:var(--paper);
    max-width:210mm; margin:26px auto; box-sizing:border-box;
    box-shadow:0 3px 18px rgba(20,24,12,.35);
  }
  table.pagewrap{width:100%;border-collapse:collapse;}
  table.pagewrap td{padding:0;vertical-align:top;}
  .content{padding:0 10mm 4mm;}
  @media print{
    body{background:#fff;}
    .doc{box-shadow:none;max-width:none;margin:0;}
  }
  @page{size:A4;margin:0;}

  /* ---------- repeating per-page tier chip ----------
     This is the ONLY thing that repeats at the top of every printed page.
     Its own top padding is what keeps content off the physical page edge —
     @page margin is 0 (see above), so this padding is the sole source of
     top breathing room on every page, first and subsequent alike. */
  .pagechip{padding:8mm 10mm 0;}

  /* ---------- tier sections ---------- */
  .tier{margin-bottom:8px;}

  .band{
    font-family:'Trebuchet MS',sans-serif;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    color:var(--paper);background:var(--acc);
    padding:2.5px 10px;border-radius:2px;display:inline-block;margin:5px 0 4px;
  }
  /* CSS Grid (display:grid, row-major auto-placement) looked identical on
     screen but fragmented terribly when Chrome paginated it for print: a grid
     row that didn't fully fit in the remaining page height got bumped whole to
     the next page, and — because grid rows don't reflow to backfill that gap —
     left 30-90% of a page blank beneath it (worst case: a whole page for 2
     leftover cards). Switching to CSS multi-column (newspaper-style: fills
     column 1 top-to-bottom, then column 2) fragments per-element instead of
     per-row, packing pages almost completely and cutting the Chameleon sheet
     from 5 pages to 4 with zero content change. Reading order is unaffected:
     both layouts preserve DOM order (= skill-tree/commandNum order) — grid
     reads it left-right-then-down, multi-column reads it down-then-next-
     column, and both are standard, equally valid reading conventions. */
  .grid{column-count:2;column-gap:10px;}
  .grid>*{break-inside:avoid;margin-bottom:7px;}

  /* ---------- skill card (active) ---------- */
  .sk{
    display:grid;grid-template-columns:70px 1fr;align-items:start;gap:1px 10px;
    border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:3px;padding:8px 9px 8px 8px;background:var(--acc-tint);
    break-inside:avoid;
  }
  .sk .ic{width:70px;height:70px;image-rendering:auto;}
  .sk .ic.multi{display:flex;flex-wrap:wrap;width:70px;height:70px;}
  .sk .ic.multi img{width:35px;height:35px;}
  /* A skill whose range/AoE benefits from a small diagram stacks it directly
     below the icon, in the same grid column, instead of floating it inline
     with the notes text — floating it inline left dead space above the figure
     whenever the chips block was short, and made the notes wrap oddly around
     empty air. The icon itself stays the standard 70px, but the diagram below
     it is allowed to render larger than the column (overflow:visible) since a
     cramped 70px figure loses its labels — it stays clear of the card's own
     left edge and the notes text at the sizes used so far (see zeroShot5). */
  .sk .ic-stack{display:flex;flex-direction:column;align-items:center;gap:4px;overflow:visible;}
  .sk .ic-stack .ic{width:70px;height:70px;flex:none;}
  /* A .wide card (spans both grid columns) has a lot of spare horizontal
     room — center the icon+body pair as a block with a capped reading width
     instead of letting the body column stretch and fill the full width.
     Two earlier approaches both looked "centered" by the numbers but read as
     lopsided on screen (see SKILL.md Common Mistakes for the full story):
     (1) justify-content:center directly on .sk.wide gets fought by the
     .body's own nested flex/grid min-width, and (2) a FIXED width:650px
     wrapper with margin:0 auto centers the box itself just fine, but its
     left-aligned content often doesn't reach the box's own right edge,
     leaving a dead strip of card-tint that reads as "not centered" even
     though the box's margins are provably equal. The fix is to let the box
     shrink-to-fit its own content (inline-grid + width:fit-content, capped
     by max-width) so there's no leftover width left to look lopsided, then
     center THAT with plain text-align:center on the block parent. */
  .sk.wide{display:block;text-align:center;column-span:all;}
  .sk.wide .wide-inner{
    display:inline-grid;grid-template-columns:70px 1fr;align-items:center;gap:1px 10px;
    width:fit-content;max-width:min(650px,100%);text-align:left;
  }
  .sk .body{min-width:0;}
  .sk h3{margin:0;font-size:12.5px;font-family:'Trebuchet MS',sans-serif;letter-spacing:.01em;}
  /* Fixed 3-row chip layout, same order on every card: row1 = CD/MP/SP/other
     cost, row2 = cast time (or an explicit INSTANT chip)/duration/range,
     row3 = damage/KO. Each row is its own flex-wrap line so the grouping
     holds regardless of card width. */
  .chips{display:flex;flex-direction:column;gap:5px;margin:3px 0;}
  .chiprow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  .chip{
    font-family:Consolas,monospace;font-variant-numeric:tabular-nums;
    font-size:9.4px;line-height:1;padding:3.5px 4px;border-radius:2px;
    background:var(--chip-bg);color:var(--ink);white-space:nowrap;
    /* inline-block so padding fully and predictably controls the chip's
       rendered height — plain "inline" left padding affecting only the
       painted background, not the box height a height tweak expects. */
    display:inline-block;vertical-align:middle;
  }
  .chip b{font-weight:700;}
  .chip .t{color:var(--ink-soft);font-size:8.4px;letter-spacing:.06em;}
  .chip.cd{background:#fff;border:1px solid var(--acc);}
  .chip.dmg{background:var(--acc);color:#fff;padding:1px 4px;}
  .chip.ko{background:#F1E3D0;color:#7A4A22;border:1px solid #C9A877;}
  .chip.rng{background:#FBEEDD;border:1px solid #C97A2B;}
  .chip.rng .t{color:var(--ink);}
  .chip.rng b{color:#C97A2B;}
  .chip.dur{background:#EFE9F9;border:1px solid #7B5EA8;}
  .chip.dur .t{color:var(--ink);}
  .chip.dur b{color:#7B5EA8;}
  .chip.cast,.chip.instant{background:#E1F5F7;border:1px solid #1B8A94;}
  .chip.cast .t{color:var(--ink);}
  .chip.cast b{color:#1B8A94;}
  .chip.instant{font-style:italic;color:#1B8A94;}
  /* .chip.chance ({{chance:N}}) has no per-type color rule of its own — it's
     exclusively an inline chip type, so its full styling comes from the
     shared .chip-inline rule below (dmg's look, same as every other inline
     chip). */
  /* SP comes in two flavors (mirrors the game's own tooltip color convention,
     GameGui.cs: cSP<0 -> red text, cSP>0 -> blue text): red SP is spent on
     cast, blue SP is only a threshold you must have — it is never deducted. */
  .chip.spr{background:#fff;border:1px solid #B23B2E;}
  .chip.spr .t{color:var(--ink);}
  .chip.spr b{color:#B23B2E;}
  .chip.spb{background:#fff;border:1px solid #2A63A8;}
  .chip.spb .t{color:var(--ink);}
  .chip.spb b{color:#2A63A8;}
  /* same red/blue, for inline prose mentions outside a chip */
  b.spr{color:#B23B2E;}
  b.spb{color:#2A63A8;}
  /* MP: same treatment as SP-blue, but with a light blue fill instead of white */
  .chip.mp{background:#E3EEF9;border:1px solid #2A63A8;}
  .chip.mp .t{color:var(--ink);}
  .chip.mp b{color:#2A63A8;}
  /* Inline chips (rendered via {{token}} inside notes prose) are a full
     visual clone of .chip.dmg — same background/color/padding/border (none),
     regardless of the chip's own type/color theme when it appears in the
     fixed row. Declared last, after every .chip.<type> rule above (and using
     .t/b descendant overrides so the label/value spans don't keep their
     per-type color), so it always wins the cascade at equal specificity
     without needing !important. */
  .chip.chip-inline{background:var(--acc);color:#fff;padding:1px 4px;border:none;box-shadow:none;}
  .chip.chip-inline .t{color:#fff;}
  .chip.chip-inline b{color:#fff;}
  /* Top-down AoE shape diagram (cone/rectangle/etc) for a skill's notes to wrap
     around — float it left as the first child of .body, before .chips/.notes,
     and it reads like a magazine pull-figure instead of eating a full row. Reuse
     for any class's shaped-AoE skill (cone, rectangle, ring) by swapping the
     <polygon>/<circle> points and the two-line dimension caption underneath. */
  .aoefig{float:left;margin:1px 10px 4px 0;text-align:center;}
  .aoefig .cap{font-size:7.4px;color:var(--ink-soft);margin-top:1px;}
  .notes{margin:3px 0 0;padding-left:13px;font-size:9.4px;line-height:1.4;color:var(--ink);}
  .notes li{margin:0 0 3px;}
  .notes li:last-child{margin-bottom:0;}
  .notes li::marker{color:var(--acc);}
  .warn{color:var(--ko);font-weight:600;}
  .syn{color:var(--acc);font-weight:600;}

  /* ---------- passive row ---------- */
  .pv{
    display:flex;gap:9px;align-items:start;
    border:1px solid var(--line);border-radius:3px;background:#fff;
    padding:7px 9px;break-inside:avoid;
  }
  .pv img{width:70px;height:70px;flex:none;}
  .pv .tx{font-size:9.5px;line-height:1.32;}
  .pv .tx b.nm{font-family:'Trebuchet MS',sans-serif;font-size:11px;display:block;margin-bottom:1px;}
  .wide{column-span:all;margin-top:7px;}
  .wtable{margin-top:3px;overflow-x:auto;}
  .wtable table{border-collapse:collapse;width:100%;font-size:8px;}
  .wtable th{
    text-align:left;font-family:'Trebuchet MS',sans-serif;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;font-size:7.2px;color:var(--ink-soft);
    border-bottom:1px solid var(--acc);padding:1.5px 6px 1.5px 0;white-space:nowrap;
  }
  .wtable td{padding:1.5px 6px 1.5px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  .wtable tr:last-child td{border-bottom:none;}
  .wnote{font-size:7.6px;color:var(--ink-soft);margin-top:2px;line-height:1.3;}

  /* ---------- view toggle + stat panel ---------- */
  .controlbar{
    padding:8mm 10mm 4mm;display:flex;gap:16px;flex-wrap:wrap;align-items:center;
    font-family:'Trebuchet MS',sans-serif;font-size:11px;
  }
  .viewtoggle{display:inline-flex;border:1px solid var(--acc);border-radius:4px;overflow:hidden;}
  .viewtoggle button{
    font:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;
    padding:5px 12px;border:none;background:var(--paper);color:var(--acc);cursor:pointer;
  }
  .viewtoggle button.active{background:var(--acc);color:#fff;}
  .revisedarttoggle{
    border:1px solid var(--acc);border-radius:4px;background:var(--paper);
    padding:2px;cursor:pointer;line-height:0;
  }
  .revisedarttoggle img{width:28px;height:28px;display:block;filter:grayscale(100%);opacity:.5;}
  .revisedarttoggle.on img{filter:none;opacity:1;}
  .revisedarttoggle.on{border-color:#9A7B0A;}
  .statgroup{display:flex;flex-direction:column;gap:3px;}
  .statgrouplabel{font-size:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
  .statpanel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .statpanel.disabled{opacity:.4;pointer-events:none;}
  .statpanel label{display:flex;flex-direction:column;font-size:8.5px;color:var(--ink-soft);gap:2px;}
  .statpanel input{
    width:52px;font:inherit;font-size:11px;padding:3px 5px;border:1px solid var(--line);
    border-radius:3px;background:var(--paper);color:var(--ink);
  }
  /* ---------- rank selector ---------- */
  /* Rank buttons and any classC toggles share one row so a card's controls
     read as a single control strip, not stacked lines. */
  .ctrlrow{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;margin:0 0 3px;}
  .ranktoggle{display:flex;gap:3px;}
  .ranktoggle button{
    font-family:Consolas,monospace;font-size:9px;font-weight:700;
    width:18px;height:18px;line-height:1;border:1px solid var(--acc);border-radius:2px;
    background:var(--paper);color:var(--acc);cursor:pointer;padding:0;
  }
  .ranktoggle button.active{background:var(--acc);color:#fff;}
  .classctoggle{
    display:inline-flex;align-items:center;gap:3px;
    font-family:Consolas,monospace;font-size:8.5px;font-weight:700;
    padding:2px 6px;border:1px solid var(--acc);border-radius:2px;
    background:var(--paper);color:var(--acc);cursor:pointer;
  }
  .classctoggle input{margin:0;cursor:pointer;}
  /* Dark gold marks an active (ON) Class C synergy — both the toggle
     control itself and the bonus line it reveals in .notes, so the whole
     synergy (control + text) reads as one gold-tinted unit. */
  .classctoggle.on{background:#9A7B0A;border-color:#9A7B0A;color:#fff;}
  .classc-on{color:#9A7B0A;}
  .computed{font-weight:700;}
  .computed.prob{font-weight:400;}
</style>

// ===== Formula evaluator (Task 3): tokenizer, parser, symbolic + numeric render =====
// Hand-rolled recursive-descent parser — no eval()/Function() constructor anywhere.
function tokenizeFormula(expr) {
  const re = /\s*(?:(\d+\.?\d*)|(ATK|INT|AGI|CHA|TAL|LCK|Lv)|(agiAdjust|magAdjust|chaAdjust|talAdjust|lckAdjust|clamp)|([()+\-×*/⌈⌉⌊⌋,]))\s*/g;
  const tokens = [];
  let m, pos = 0;
  while (pos < expr.length) {
    re.lastIndex = pos;
    m = re.exec(expr);
    if (!m || m.index !== pos) throw new Error(`Bad formula token at "${expr.slice(pos)}"`);
    if (m[1]) tokens.push({t:"num", v:parseFloat(m[1])});
    else if (m[2]) tokens.push({t:"stat", v:m[2]});
    else if (m[3]) tokens.push({t:"fn", v:m[3]});
    else if (m[4]) tokens.push({t:"op", v:m[4]});
    pos = re.lastIndex;
  }
  return tokens;
}

// Recursive-descent parser: expr := term (('+'|'-') term)*
//                            term := factor (('×'|'*'|'/') factor)*
//                            factor := num | stat | fn '(' expr ')' | '(' expr ')' | '⌈' expr '⌉' | '⌊' expr '⌋'
function parseFormula(expr) {
  const tokens = tokenizeFormula(expr);
  let i = 0;
  function peek() { return tokens[i]; }
  function next() { return tokens[i++]; }

  function parseExpr() {
    let node = parseTerm();
    while (peek() && peek().t === "op" && (peek().v === "+" || peek().v === "-")) {
      const op = next().v;
      node = { type: "bin", op, left: node, right: parseTerm() };
    }
    return node;
  }
  function parseTerm() {
    let node = parseFactor();
    while (peek() && peek().t === "op" && (peek().v === "×" || peek().v === "*" || peek().v === "/")) {
      const opTok = next().v;
      const opActual = opTok === "/" ? "/" : "×";
      node = { type: "bin", op: opActual, left: node, right: parseFactor() };
    }
    return node;
  }
  function parseFactor() {
    const tok = next();
    if (tok.t === "num") return { type: "num", v: tok.v };
    if (tok.t === "stat") return { type: "stat", v: tok.v };
    if (tok.t === "fn") {
      if (next().v !== "(") throw new Error(`Expected ( after ${tok.v}`);
      const args = [parseExpr()];
      while (peek() && peek().t === "op" && peek().v === ",") { next(); args.push(parseExpr()); }
      if (next().v !== ")") throw new Error(`Expected ) closing ${tok.v}`);
      return tok.v === "clamp" ? { type:"clamp", args } : { type: "fn", name: tok.v, arg: args[0] };
    }
    if (tok.t === "op" && tok.v === "(") {
      const node = parseExpr();
      if (next().v !== ")") throw new Error("Expected )");
      return node;
    }
    if (tok.t === "op" && tok.v === "⌈") {
      const node = parseExpr();
      if (next().v !== "⌉") throw new Error("Expected ⌉");
      return { type: "ceil", arg: node };
    }
    if (tok.t === "op" && tok.v === "⌊") {
      const node = parseExpr();
      if (next().v !== "⌋") throw new Error("Expected ⌋");
      return { type: "floor", arg: node };
    }
    throw new Error(`Unexpected token ${JSON.stringify(tok)}`);
  }

  const ast = parseExpr();
  if (i !== tokens.length) throw new Error(`Trailing tokens in "${expr}"`);
  return ast;
}

const ADJUSTER_TAGS = { agiAdjust: null, magAdjust: "INT↓", chaAdjust: "CHA↑", talAdjust: null, lckAdjust: "LCK↑" };

function renderSymbolic(ast) {
  switch (ast.type) {
    case "num": return String(ast.v);
    case "stat": return ast.v;
    case "ceil": return `⌈${renderSymbolic(ast.arg)}⌉`;
    case "floor": return `⌊${renderSymbolic(ast.arg)}⌋`;
    case "bin": {
      // A child needs parens when appearing under ×/÷ if its own rendering
      // is (or unconditionally produces) a lower-precedence +/- expression;
      // otherwise left-to-right ×/÷ concatenation is already unambiguous.
      const needsParensAsMulOperand = (node) =>
        (node.type === "bin" && (node.op === "+" || node.op === "-")) ||
        (node.type === "fn" && node.name === "talAdjust");
      const wrap = (node) => {
        const rendered = renderSymbolic(node);
        return (ast.op === "×" || ast.op === "/") && needsParensAsMulOperand(node)
          ? `(${rendered})`
          : rendered;
      };
      return `${wrap(ast.left)} ${ast.op} ${wrap(ast.right)}`;
    }
    case "fn": {
      const inner = renderSymbolic(ast.arg);
      const tag = ADJUSTER_TAGS[ast.name];
      // talAdjust/agiAdjust fold into the surrounding formula's own displayed
      // tag (CD chip already says agiAdjust; TAL(n) is pre-expanded per the
      // template's documented convention) rather than adding a redundant tag.
      if (ast.name === "talAdjust") {
        // Wrap compound (binary) expressions in parens; leave atomic ones bare
        const wrappedInner = ast.arg.type === "bin" ? `(${inner})` : inner;
        // If the inner argument is a compile-time-constant number (not a stat
        // token or an unresolved compound expression), pre-multiply the fixed
        // 0.02 coefficient into it now so we display one number instead of
        // the arithmetic (e.g. "15 + 0.3×TAL" not "15 + 0.02×15×TAL"). This
        // is a general rule: two adjacent numeric literals with no stat token
        // involved get folded into a single coefficient at symbolic-render
        // time. Anything else (a bare stat token, or a compound expression
        // that can't be reduced without knowing stat values) falls back to
        // the unmultiplied display form.
        if (ast.arg.type === "num") {
          const coeff = 0.02 * ast.arg.v;
          return `${wrappedInner} + ${coeff}×TAL`;
        }
        return `${wrappedInner} + 0.02×${wrappedInner}×TAL`;
      }
      return tag ? `${inner} <span class="adj">${tag}</span>` : inner;
    }
    case "clamp": return `clamp(${ast.args.map(renderSymbolic).join(", ")})`;
  }
}

// A "roll" is the random(0, ceil(0.2*LCK)) term every adjuster function
// draws from its own relevant character's LCK stat in the real game
// (CharacterControl.cs). rollMode "min" always evaluates the roll as 0;
// "max" evaluates it as its ceiling, ceil(0.2*rollStat). Exact per-function
// formulas and rounding below are transcribed verbatim from source, not
// approximated — see docs/superpowers/specs/2026-07-22-penguin-lck-range-and-revisedart-design.md.
function rollValue(rollStat, rollMode) {
  return rollMode === "max" ? Math.ceil(0.2 * rollStat) : 0;
}

// agiAdjust/magAdjust/chaAdjust/talAdjust each need TWO stats (the roll's own
// stat, e.g. AGI, AND LCK for the roll's ceiling) — a single-stat helper
// signature doesn't fit all of them cleanly, so each gets its own explicit
// function instead of forcing a shared shape that would obscure the exact
// per-function source formula. All four take (v, statValue, lckValue, rollMode).
function evalAgiAdjust(v, agi, lck, rollMode) {
  const num = agi + rollValue(lck, rollMode);
  return v * (1 - num / (num + 128));
}
function evalMagAdjust(v, intStat, lck, rollMode) {
  const num = Math.min(Math.max(intStat + rollValue(lck, rollMode), 1), 512);
  // CharacterControl.cs:20587 — num/32 is integer division (num and 32 both
  // int in source), truncating toward zero BEFORE the subtraction.
  const divided = Math.trunc(num / 32);
  return Math.min(Math.max(v - divided, 0.1), 600);
}
function evalChaAdjust(v, cha, lck, rollMode) {
  const num = Math.min(Math.max(cha + rollValue(lck, rollMode), 1), 512);
  const truncated = Math.trunc(v * (1 + 0.015 * num));
  // CharacterControl.cs:20593-20619 — ceil only applies in the t>0 branch;
  // a non-positive result returns as-is, un-ceil'd.
  return truncated > 0 ? Math.ceil(truncated) : truncated;
}
function evalTalAdjust(v, tal, lck, rollMode) {
  if (v <= 0) return 0;
  const num = Math.min(Math.max(tal + rollValue(lck, rollMode), 1), 512);
  const truncated = Math.trunc(v * (1 + 0.02 * num));
  return Math.ceil(truncated);
}
function evalLckAdjust(v, lck) {
  // lckAdjust has no random roll of its own (CharacterControl.cs:20658-20671)
  // — it's a deterministic diminishing-returns curve on the caster's own LCK,
  // unaffected by min/max roll mode. Exact source: v<=0 returns 0 outright;
  // otherwise lck is clamped to [1,512] before use, and the result is
  // floored (source always returns an int), not left as a raw float.
  if (v <= 0) return 0;
  const clampedLck = Math.min(Math.max(lck, 1), 512);
  const num = v * (1 + 0.01 * clampedLck);
  return Math.floor(100 * num / (num - v + 100));
}

// dmgAdjust and defAdjust are NOT reachable via the generic `fn` AST case —
// no Penguin skill formula string contains a literal "dmgAdjust(...)" or
// "defAdjust(...)" call (those two only ever apply to a dmg chip's ALREADY-
// evaluated final number, as a post-processing step — see Task 3's dmg-chip
// wrapper). They're defined here as plain functions, not evaluator cases,
// since they never appear inside a parsed formula AST.
function evalDmgAdjust(d, damageMod, attackerLck, rollMode) {
  const roll = rollValue(attackerLck, rollMode);
  const clampedMod = Math.min(Math.max(damageMod, 0), 5);
  return Math.ceil(clampedMod * d + roll);
}
function evalDefAdjust(d, def, defenderLck, rollMode) {
  const defRoll = rollValue(defenderLck, rollMode);
  const defPrime = Math.min(Math.max(def + defRoll, 1), 512);
  let flat = Math.trunc(d - 0.5 * defPrime);
  if (flat < 1) flat = 1;
  let pct = Math.trunc(d * (1 - defPrime / (defPrime + 64)));
  if (pct < 1) pct = 1;
  return Math.ceil(0.35 * flat + 0.65 * pct);
}

// Walks an AST once, evaluating every LCK-adjuster at the given roll extreme
// ("min" or "max"), using `stats` for the attacker-side values (ATK/INT/AGI/
// CHA/TAL/LCK/Lv/damageMod — the existing global `stats` object, extended in
// Task 2). Defender stats never appear inside a formula AST (no skill formula
// references enemy stats directly) — defAdjust is applied separately in
// Task 3's dmg-chip wrapper, not through this function.
function renderRange(ast, stats, rollMode) {
  switch (ast.type) {
    case "num": return ast.v;
    case "stat": return stats[ast.v] || 0;
    case "ceil": return Math.ceil(renderRange(ast.arg, stats, rollMode));
    case "floor": return Math.floor(renderRange(ast.arg, stats, rollMode));
    case "bin": {
      const l = renderRange(ast.left, stats, rollMode), r = renderRange(ast.right, stats, rollMode);
      if (ast.op === "+") return l + r;
      if (ast.op === "-") return l - r;
      if (ast.op === "×") return l * r;
      if (ast.op === "/") return l / r;
      throw new Error(`Unknown op ${ast.op}`);
    }
    case "fn": {
      const v = renderRange(ast.arg, stats, rollMode);
      switch (ast.name) {
        case "agiAdjust": return evalAgiAdjust(v, stats.AGI, stats.LCK, rollMode);
        case "magAdjust": return evalMagAdjust(v, stats.INT, stats.LCK, rollMode);
        case "chaAdjust": return evalChaAdjust(v, stats.CHA, stats.LCK, rollMode);
        case "talAdjust": return evalTalAdjust(v, stats.TAL, stats.LCK, rollMode);
        case "lckAdjust": return evalLckAdjust(v, stats.LCK);
        default: throw new Error(`Unknown fn ${ast.name}`);
      }
    }
    case "clamp": {
      const [expr, lo, hi] = ast.args.map(a => renderRange(a, stats, rollMode));
      return Math.min(Math.max(expr, lo), hi);
    }
  }
}

function formatNumber(n) {
  if (Math.abs(n - Math.round(n)) < 0.05) return String(Math.round(n));
  return n.toFixed(1);
}

// ===== Card renderer + state (Task 4) =====
// Formats a computed {min,max} pair as "N" (if min===max after formatting)
// or "[min-max]" otherwise. Suffix (e.g. "s") is appended once, outside
// the brackets, per the design's display-format decision.
//
// Sorts its two inputs before formatting: renderRange's "min"/"max" args
// select a roll DIRECTION (roll=0 vs roll=ceil(0.2*LCK)), not a guaranteed
// output ordering. For adjusters that DECREASE as the roll grows (agiAdjust
// on a CD formula, magAdjust on a CAST formula, defAdjust inside the dmg
// pipeline), the "min"-rollMode call actually yields the numerically LARGER
// result. Sorting here guarantees the displayed bracket is always true
// numeric [low-high], regardless of which internal call produced which
// value — verified by hand: agiAdjust(16) with AGI=80/LCK=40 gives
// min-rollMode=9.85, max-rollMode=9.48 (inverted), so without this sort the
// chip would have displayed "[9.8-9.5]" instead of the correct "[9.5-9.8]".
function formatRange(a, b, suffix) {
  const lo = Math.min(a, b), hi = Math.max(a, b);
  const minS = formatNumber(lo), maxS = formatNumber(hi);
  return minS === maxS ? `${minS}${suffix}` : `${minS}-${maxS}${suffix}`;
}

function chipHTML(cls, label, formulaOrConst, view, stats, suffix, revisedArtOn, inline) {
  suffix = suffix || "";
  const clsAttr = inline ? `${cls} chip-inline` : cls;
  if (typeof formulaOrConst === "number") {
    return `<span class="chip ${clsAttr}">${label?`<span class="t">${label}</span> `:""}<b>${formulaOrConst}${suffix}</b></span>`;
  }
  const ast = parseFormula(formulaOrConst);
  let body;
  if (view === "plugin") {
    let min = renderRange(ast, stats, "min");
    let max = renderRange(ast, stats, "max");
    // revisedArt5: ceil(0.88 * cTime), applied strictly AFTER the base CD
    // range, to both endpoints independently — CD chips only (identified
    // by cls === "cd"). See Task 5 for how revisedArtOn is threaded in.
    if (cls === "cd" && revisedArtOn) {
      min = Math.ceil(0.88 * min);
      max = Math.ceil(0.88 * max);
    }
    body = `<b class="computed">${formatRange(min, max, suffix)}</b>`;
  } else {
    body = `<b>${renderSymbolic(ast)}${suffix}</b>`;
  }
  return `<span class="chip ${clsAttr}">${label?`<span class="t">${label}</span> `:""}${body}</span>`;
}

// Inline-chip substitution: a notes string may contain {{token}} placeholders
// (dmg, cd, mp, sp, cast, range, ko) that get replaced with the same
// chip-styled HTML the fixed chip row uses, so a sentence like "each dealing
// {{dmg}} damage" renders a live, view-aware chip in place of the token.
// Only "dmg" is ALSO removed from the fixed row unconditionally (whether or
// not a card's notes actually reference {{dmg}}) — every other field keeps
// rendering in its row regardless of whether it's also referenced inline.
const INLINE_CHIP_RE = /\{\{(dmg|cd|mp|sp|cast|range|ko|chance:(\d+(?:\.\d+)?))\}\}/g;
function substituteInlineChips(text, r, view, stats, enemyStats, revisedArtOn) {
  return text.replace(INLINE_CHIP_RE, (_, token, chanceLiteral) => {
    // {{chance:N}} is parameterized — the base % lives in the placeholder
    // itself (not a per-rank data field), since a single rank can reference
    // several independent LCK-adjusted chances (e.g. one per combo hit).
    // Base view shows the symbolic lckAdjust(N)% form; Final view computes
    // the real LCK-adjusted percentage from the entered Player Stats LCK.
    if (token.startsWith("chance:")) {
      const n = parseFloat(chanceLiteral);
      const body = view === "plugin"
        ? `<b class="computed">${formatNumber(evalLckAdjust(n, stats.LCK))}%</b>`
        : `<b>lckAdjust(${n})%</b>`;
      return `<span class="chip chance chip-inline">${body}</span>`;
    }
    switch (token) {
      case "dmg": {
        if (!r.dmg) return "";
        if (view !== "plugin") {
          // Base view: unchanged from today — plain symbolic chip, no
          // mitigation pipeline shown (design spec: base view is untouched).
          return chipHTML("dmg","",r.dmg,view,stats);
        }
        const ast = parseFormula(r.dmg);
        // Attacker-side rolls move together: "min" attacker roll pairs with
        // "max" defender roll (defAdjust's own internal roll direction is
        // inverted below), and vice versa, per the design's sync/invert rule.
        const baseMin = renderRange(ast, stats, "min");
        const baseMax = renderRange(ast, stats, "max");
        const afterDmgMin = evalDmgAdjust(baseMin, stats.damageMod, stats.LCK, "min");
        const afterDmgMax = evalDmgAdjust(baseMax, stats.damageMod, stats.LCK, "max");
        // Defender roll direction is INVERTED relative to the attacker's:
        // true minimum damage pairs the attacker's worst roll with the
        // defender's BEST (max DEF) roll; true maximum pairs attacker's
        // best roll with defender's WORST (min DEF) roll.
        const finalMin = evalDefAdjust(afterDmgMin, enemyStats.DEF, enemyStats.LCK, "max");
        const finalMax = evalDefAdjust(afterDmgMax, enemyStats.DEF, enemyStats.LCK, "min");
        return `<span class="chip dmg"><b class="computed">${formatRange(finalMin, finalMax, "")}</b></span>`;
      }
      case "cd": return r.cd ? chipHTML("cd","CD",r.cd,view,stats,"s",revisedArtOn,true) : "";
      case "mp": return r.mp ? chipHTML("mp","MP",r.mp,view,stats,"",undefined,true) : "";
      case "sp": return r.sp ? chipHTML(r.sp<0?"spr":"spb","SP",Math.abs(r.sp),view,stats,"",undefined,true) : "";
      case "cast": return r.cast ? chipHTML("cast","CAST",r.cast,view,stats,"s",undefined,true) : `<span class="chip instant chip-inline">INSTANT</span>`;
      case "range": return r.range === "locked" ? `<span class="chip rng chip-inline"><span class="t">Range</span> <b>Locked-on</b></span>`
        : r.range === "inf" ? `<span class="chip rng chip-inline"><span class="t">Range</span> <b>∞</b></span>`
        : r.range ? `<span class="chip rng chip-inline"><span class="t">Range</span> <b>${r.range}</b></span>` : "";
      case "ko": return (r.ko !== undefined) ? `<span class="chip ko chip-inline"><span class="t">KO</span> ${r.ko}</span>` : "";
      default: return "";
    }
  });
}

function renderSkillCard(famId, fam, rankIdx, view, stats, enemyStats, revisedArtOn) {
  const baseRank = fam.ranks[rankIdx];
  // Merge any currently-ON classC overrides onto the base rank. Later
  // array entries win if two overrides somehow touch the same field
  // (doesn't occur in current data, but keeps the merge well-defined).
  const onToggles = classCToggle[famId] || {};
  const r = (baseRank.classC || [])
    .filter(entry => onToggles[entry.passiveId])
    .reduce((merged, entry) => ({ ...merged, ...entry }), { ...baseRank });
  const el = document.createElement("div");
  el.className = "sk";
  const iconSrc = ICONS[fam.icon(r)] || "";
  const rankButtons = fam.ranks.length > 1
    ? `<div class="ranktoggle" data-fam="${famId}">${fam.ranks.map((_,i)=>
        `<button type="button" data-rank="${i}" class="${i===rankIdx?"active":""}">${i+1}</button>`).join("")}</div>`
    : "";
  const classCToggles = (baseRank.classC || []).map(entry => {
    const isOn = !!onToggles[entry.passiveId];
    return `<label class="classctoggle${isOn ? " on" : ""}" data-fam="${famId}" data-passive="${entry.passiveId}">
      <input type="checkbox" ${isOn ? "checked" : ""}> ${entry.passiveId}
    </label>`;
  }).join("");
  // A rank is "active" (has some castable/triggerable form) when it sets at
  // least one of cd/mp/sp/cast, AND mp is genuinely a resource COST there
  // (not a gain). dmg is deliberately EXCLUDED from this check — dmg now
  // only ever renders inline in notes via {{dmg}} (never in the fixed row),
  // and several skills (e.g. nAttack's ice projectile) always fire
  // regardless of any cast/cooldown gate, so a bare dmg field alone must
  // not imply "this is an active, castable skill" (Design Correction 1
  // still applies: pure passives like intellect/statPlus/astralTalent, and
  // now also nAttack despite carrying a dmg formula, render zero chip
  // rows). cAttack is the one family whose mp field is a GAIN (MP/sec
  // channeled while holding), not a cost — r.mpIsGain opts a rank out of
  // treating mp as an isActive/cost signal, so cAttack correctly renders
  // as a pure passive (its mp value is only ever shown via {{mp}} inline
  // in notes, never in the fixed cost row) while every other card's mp
  // field keeps behaving exactly as before (a real cost, shown in-row).
  const mpIsCost = r.mp && !r.mpIsGain;
  const isActive = !!(r.cd || mpIsCost || r.sp || r.cast);

  const cdChip = r.cd ? chipHTML("cd","CD",r.cd,view,stats,"s",revisedArtOn) : "";
  const mpChip = mpIsCost ? chipHTML("mp","MP",r.mp,view,stats) : "";
  const spChip = r.sp ? chipHTML(r.sp<0?"spr":"spb","SP",Math.abs(r.sp),view,stats) : "";
  const castChip = !isActive ? "" : r.cast
    ? chipHTML("cast","CAST",r.cast,view,stats,"s")
    : `<span class="chip instant">INSTANT</span>`;
  const rangeChip = !isActive ? "" : r.range === "locked" ? `<span class="chip rng"><span class="t">Range</span> <b>Locked-on</b></span>`
    : r.range === "inf" ? `<span class="chip rng"><span class="t">Range</span> <b>∞</b></span>`
    : r.range ? `<span class="chip rng"><span class="t">Range</span> <b>${r.range}</b></span>` : "";
  // dmg no longer renders in the fixed row — it's inlined into notes text
  // via a {{dmg}} placeholder instead (see substituteInlineChips above).
  const koChip = (isActive && r.ko !== undefined) ? `<span class="chip ko"><span class="t">KO</span> ${r.ko}</span>` : "";

  const row1 = `${cdChip}${mpChip}${spChip}`;
  const row2 = `${castChip}${rangeChip}`;
  const row3 = `${koChip}`;
  const chipsBlock = (row1 || row2 || row3)
    ? `<div class="chips">
        ${row1 ? `<div class="chiprow">${row1}</div>` : ""}
        ${row2 ? `<div class="chiprow">${row2}</div>` : ""}
        ${row3 ? `<div class="chiprow">${row3}</div>` : ""}
      </div>`
    : "";

  const ctrlRow = (rankButtons || classCToggles)
    ? `<div class="ctrlrow">${rankButtons}${classCToggles}</div>`
    : "";

  el.innerHTML = `
    <img class="ic" src="${iconSrc}" alt="">
    <div class="body">
      ${ctrlRow}
      <h3>${r.id.replace("pgn_","")}</h3>
      ${chipsBlock}
      <ul class="notes">${(r.notes||[]).map(n=>`<li>${substituteInlineChips(n,r,view,stats,enemyStats,revisedArtOn)}</li>`).join("")}</ul>
    </div>`;
  return el;
}

const currentRank = {};
let currentView = "base";
let revisedArtOn = false;
const stats = { ATK:0, INT:0, AGI:0, CHA:0, TAL:0, LCK:0, Lv:0, damageMod:1 };
const enemyStats = { DEF:0, CHA:0, LCK:0 };
const classCToggle = {};

function mountAllCards() {
  // Grouped by tier for Task-2's existing per-tier .grid containers.
  const tierGrids = {
    basic: document.querySelector(".tier.basic .grid"),
    classA: document.querySelector(".tier.classA .grid"),
    classB: document.querySelector(".tier.classB .grid"),
    classC: document.querySelector(".tier.classC .grid"),
  };
  for (const famId in SKILLS) {
    const fam = SKILLS[famId];
    currentRank[famId] = fam.ranks.length - 1;
    const grid = tierGrids[fam.tier];
    if (!grid) { console.error(`No .tier.${fam.tier} .grid found for ${famId}`); continue; }
    const card = renderSkillCard(famId, fam, currentRank[famId], currentView, stats, enemyStats, revisedArtOn);
    card.dataset.fam = famId;
    grid.appendChild(card);
  }
}

function rerenderAll() {
  for (const famId in SKILLS) {
    const fam = SKILLS[famId];
    const old = document.querySelector(`.sk[data-fam="${famId}"]`);
    if (!old) continue;
    const fresh = renderSkillCard(famId, fam, currentRank[famId], currentView, stats, enemyStats, revisedArtOn);
    fresh.dataset.fam = famId;
    old.replaceWith(fresh);
  }
}

document.addEventListener("click", e => {
  const rb = e.target.closest(".ranktoggle button");
  if (rb) {
    currentRank[rb.closest(".ranktoggle").dataset.fam] = parseInt(rb.dataset.rank, 10);
    rerenderAll();
    return;
  }
  const cc = e.target.closest(".classctoggle");
  if (cc) {
    const famId = cc.dataset.fam, passiveId = cc.dataset.passive;
    classCToggle[famId] = classCToggle[famId] || {};
    classCToggle[famId][passiveId] = !classCToggle[famId][passiveId];
    rerenderAll();
    return;
  }
  const ra = e.target.closest("#revisedArtToggle");
  if (ra) {
    revisedArtOn = !revisedArtOn;
    document.getElementById("revisedArtToggle").classList.toggle("on", revisedArtOn);
    rerenderAll();
    return;
  }
  const vb = e.target.closest("#viewToggle button");
  if (vb) {
    currentView = vb.dataset.view;
    document.querySelectorAll("#viewToggle button").forEach(b => b.classList.toggle("active", b === vb));
    document.getElementById("statPanel").classList.toggle("disabled", currentView !== "plugin");
    document.getElementById("enemyStatPanel").classList.toggle("disabled", currentView !== "plugin");
    rerenderAll();
  }
});

// Keyboard shortcuts: V toggles Base/Final view, R toggles revisedArt.
// Both dispatch a real click on the existing control-bar button(s) rather
// than re-implementing the toggle logic a second time, so there is exactly
// one code path for each toggle regardless of how it was triggered. Ignored
// while focus is in a text/number input (e.g. typing into a stat field),
// so pressing "r" while entering a value doesn't accidentally fire the
// revisedArt toggle.
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  const key = e.key.toLowerCase();
  if (key === "v") {
    const other = document.querySelector(`#viewToggle button[data-view="${currentView === "plugin" ? "base" : "plugin"}"]`);
    if (other) other.click();
  } else if (key === "r") {
    document.getElementById("revisedArtToggle").click();
  }
});

// Plug-in stat values persist across page reloads via localStorage, so a
// reader doesn't have to retype their character's stats every visit. Only
// the 8 player stat numbers are persisted here (enemy stats have their own
// block below) — view mode, rank selections, and classC toggles all still
// reset to their defaults on reload.
const STATS_STORAGE_KEY = "penguinSheetStats";
try {
  const saved = JSON.parse(localStorage.getItem(STATS_STORAGE_KEY) || "{}");
  for (const key in stats) {
    if (typeof saved[key] === "number") {
      stats[key] = saved[key];
      const inp = document.getElementById("stat-" + key);
      if (inp) inp.value = saved[key];
    }
  }
} catch (e) { /* corrupt/inaccessible storage — fall back to defaults silently */ }

document.querySelectorAll("#statPanel input").forEach(inp => {
  inp.addEventListener("input", () => {
    stats[inp.id.replace("stat-","")] = parseFloat(inp.value) || 0;
    try { localStorage.setItem(STATS_STORAGE_KEY, JSON.stringify(stats)); } catch (e) {}
    if (currentView === "plugin") rerenderAll();
  });
});

// Enemy stat values persist the same way, under their own storage key and
// input-id prefix, so plugging in an enemy's DEF/CHA/LCK survives reloads
// too without colliding with the player's own stat keys.
const ENEMY_STATS_STORAGE_KEY = "penguinSheetEnemyStats";
try {
  const savedEnemy = JSON.parse(localStorage.getItem(ENEMY_STATS_STORAGE_KEY) || "{}");
  for (const key in enemyStats) {
    if (typeof savedEnemy[key] === "number") {
      enemyStats[key] = savedEnemy[key];
      const inp = document.getElementById("enemystat-" + key);
      if (inp) inp.value = savedEnemy[key];
    }
  }
} catch (e) { /* corrupt/inaccessible storage — fall back to defaults silently */ }

document.querySelectorAll("#enemyStatPanel input").forEach(inp => {
  inp.addEventListener("input", () => {
    enemyStats[inp.id.replace("enemystat-","")] = parseFloat(inp.value) || 0;
    try { localStorage.setItem(ENEMY_STATS_STORAGE_KEY, JSON.stringify(enemyStats)); } catch (e) {}
    if (currentView === "plugin") rerenderAll();
  });
});

document.getElementById("revisedArtToggle").innerHTML = `<img src="${ICONS["revisedArt5"]}" alt="revisedArt5">`;

mountAllCards();
</script>
